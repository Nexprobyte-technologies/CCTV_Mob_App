# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html
# For more information on how to configure your build environment visit https://reactnative.dev/docs/environment-setup

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.workers.max=4
newArchEnabled=true
hermesEnabled=true

# AndroidX
android.useAndroidX=true
# Silence AGP 8.6 warning (compileSdk 36 is fine for this app)
android.suppressUnsupportedCompileSdk=36

# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true
