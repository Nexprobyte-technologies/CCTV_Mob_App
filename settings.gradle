pluginManagement { includeBuild("node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }

// Autolink third-party React Native libraries. The React Native CLI (`config`
// command) is executed inside this project root folder, where package.json lives.
// NOTE: The template defaults point to `../` (android/ subfolder layout); this
// project keeps the Android build at the repository root, so we pass settingsDir.
def settingsDirFile = settingsDir
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(
        ['cmd', '/c', 'npx', '@react-native-community/cli', 'config'],
        settingsDirFile
    )
}

rootProject.name = 'NetFocus'
include ':app'
includeBuild('node_modules/@react-native/gradle-plugin')
